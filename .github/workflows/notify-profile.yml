name: Notify profile to refresh

# Fires on every push to main — including the push you'll likely make
# right around when you flip this repo from private to public.
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger skhicha/skhicha README rebuild
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.NOTIFY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/skhicha/skhicha/dispatches \
            -d '{"event_type":"repo-updated"}'
